name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create web directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nellikrishnaprasad.farmerapp",
            "appName": "Smart Farmer Expense Manager",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Show APK and AAB
        run: |
          echo "APK:"
          find android/app/build/outputs -type f -name "*.apk" -print

          echo "AAB:"
          find android/app/build/outputs -type f -name "*.aab" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-farmer-expense-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-farmer-expense-manager-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
