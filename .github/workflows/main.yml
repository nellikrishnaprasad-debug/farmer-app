name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create web directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nellikrishnaprasad.farmerapp",
            "appName": "Smart Farmer Expense Manager",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Android AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Show build files
        run: |
          echo "=============================="
          echo "AAB FILES"
          echo "=============================="
          find android/app/build/outputs -type f -name "*.aab" -print || true

          echo "=============================="
          echo "APK FILES"
          echo "=============================="
          find android/app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-farmer-expense-manager-aab
          path: android/app/build/outputs/**/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-farmer-expense-manager-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
